apiVersion: 1 # Grafana alerting provisioning API version.

groups:
  - orgId: 1 # Grafana organization ID.
    name: microservices-slo-rules # Logical alerting group for service health.
    folder: Microservices Monitoring
    interval: 1m # Rule evaluation interval.
    rules:
      - uid: high-error-rate
        title: HighErrorRate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum(rate({__name__=~"http.server.request.duration_count|http_server_request_duration_seconds_count",http_response_status_code=~"5.."}[5m])) / clamp_min(sum(rate({__name__=~"http.server.request.duration_count|http_server_request_duration_seconds_count"}[5m])), 1)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        for: 2m
        noDataState: NoData
        execErrState: Alerting
        annotations:
          summary: 5xx error rate is above 5% for the monitored services.
          runbook_url: https://example.com/runbooks/high-error-rate
        labels:
          severity: critical

      - uid: high-latency-p95
        title: HighLatencyP95
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: histogram_quantile(0.95, sum by (le) (rate({__name__=~"http.server.request.duration_bucket|http_server_request_duration_seconds_bucket"}[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        for: 5m
        noDataState: NoData
        execErrState: Alerting
        annotations:
          summary: P95 latency is above 1s for at least 5 minutes.
          runbook_url: https://example.com/runbooks/high-latency-p95
        labels:
          severity: warning

      - uid: service-down
        title: ServiceDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: min(up)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: eq
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: One or more services are not scrapeable (up == 0).
          runbook_url: https://example.com/runbooks/service-down
        labels:
          severity: critical
