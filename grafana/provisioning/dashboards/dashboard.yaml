apiVersion: 1 # Grafana dashboard provisioning API version.

providers:
  - name: Golden Signals # Provider for pre-provisioned observability dashboards.
    orgId: 1
    folder: Microservices Monitoring
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30 # Refresh dashboard files from disk periodically.
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards # Required dashboard source path.
      foldersFromFilesStructure: false
